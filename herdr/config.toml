onboarding = false

[ui]
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = false

[keys]
# New git worktree workspace, direct chord instead of the default
# two-step "prefix+shift+g".
new_worktree = "alt+w"

# Git diff/status/log viewer as a session-modal popup.
# Direct alt+key chord (no prefix step). Runs through an interactive
# zsh so .zshrc (mise activate) puts mise-installed tools like lazygit
# on PATH; herdr spawns commands directly and does not source shell
# rc files itself.
[[keys.command]]
key = "alt+g"
type = "popup"
command = "zsh -ic lazygit"
width = "80%"
height = "80%"

# File explorer as a session-modal popup. Same reasoning as above.
[[keys.command]]
key = "alt+f"
type = "popup"
command = "zsh -ic yazi"
width = "80%"
height = "80%"

# Code editor (neovim) as a session-modal popup. Same reasoning as above.
[[keys.command]]
key = "alt+c"
type = "popup"
command = "zsh -ic nvim"
width = "80%"
height = "80%"
