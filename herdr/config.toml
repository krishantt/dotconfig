onboarding = false

[ui]
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = false

# Git diff/status/log viewer as a session-modal popup.
# Runs through an interactive zsh so .zshrc (mise activate) puts
# mise-installed tools like lazygit on PATH; herdr spawns commands
# directly and does not source shell rc files itself.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "zsh -ic lazygit"
width = "80%"
height = "80%"

# File explorer as a session-modal popup. Same PATH reasoning as above.
[[keys.command]]
key = "prefix+alt+f"
type = "popup"
command = "zsh -ic yazi"
width = "80%"
height = "80%"
